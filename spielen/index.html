<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Kernwacht</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0b12; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0d0b12; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      color: #f2dca0; font: 600 15px/1.4 system-ui, sans-serif; background: radial-gradient(circle at 50% 40%, #2a1d36, #0d0b12 70%); }
    #loader h1 { margin: 0; font-size: 40px; letter-spacing: 6px; color: #f5d78a; text-shadow: 0 0 24px #b66cf088; }
    #bar { width: min(420px, 80vw); height: 8px; border-radius: 4px; background: #241a2e; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #b36cf0, #f2b04a); transition: width .2s; }
    #hint { color: #9a90a8; font-weight: 400; font-size: 13px; }
    #err { color: #ff8a7a; max-width: 80vw; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><h1>KERNWACHT</h1><div id="bar"><div id="fill"></div></div><div id="hint">Lädt … (beim ersten Mal ca. 40 MB)</div><div id="err"></div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    // Grafikkontext verloren (Treiber, Speicherdruck, Browser-Spar- oder RAM-Begrenzer): Ohne Neuladen bleiben
    // Gelände und Modelle danach unsichtbar. Der Spielstand wird zu jeder Welle gesichert – also automatisch neu laden.
    var kwLost = false;
    canvas.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      if (kwLost) return;
      kwLost = true;
      var o = document.createElement("div");
      o.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,11,18,.88);color:#f2dca0;font:600 18px system-ui,sans-serif;z-index:9;text-align:center;padding:24px";
      o.textContent = "Der Browser hat die Grafik zurückgesetzt – Kernwacht lädt neu, dein Spielstand ab der letzten Welle bleibt erhalten …";
      document.body.appendChild(o);
      setTimeout(function () { location.reload(); }, 1500);
    }, false);
    var config = {
      dataUrl: "Build/WebGL.data.unityweb?v=08f2f6bbe2",
      frameworkUrl: "Build/WebGL.framework.js.unityweb?v=08f2f6bbe2",
      codeUrl: "Build/WebGL.wasm.unityweb?v=08f2f6bbe2",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GhostOFabian",
      productName: "Kernwacht",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js?v=08f2f6bbe2";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector("#fill").style.width = Math.round(p * 100) + "%";
      }).then(function () {
        document.querySelector("#loader").style.display = "none";
        canvas.focus();
      }).catch(function (m) {
        document.querySelector("#err").textContent = "Fehler beim Start: " + m;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
